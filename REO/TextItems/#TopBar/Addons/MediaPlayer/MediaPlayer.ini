[Rainmeter]
Author=Xyrfo and fediaFedia
Update=86400000
MiddleMouseDownAction=!DeactivateConfig

[Metadata]
Version=6.0
Information=MediaPlayer Addon
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[variables]
@include=#ROOTCONFIGPATH#\REO\Panels\Mediacontrol\UserVariables.inc

@include2=#@#Common\Variables\UserVariables.inc

[solid]
Meter=Image
W=(80)*#scaledpi#
H=(20)*#scaledpi#
SolidColor=0,0,0,1
UpdateDivider=864000

[buttanstyl]
X=(5)*#scaledpi#R
Y=(2)*#scaledpi#
W=(20)*#scaledpi#
SolidColor=0,0,0,1
ImageAlpha=230
ImageTint=#textcolor2#
MouseActionCursor=1

[Prev]
Meter=Image
ImageName=#@#Graphics\TextItems\NowPlaying\Prev.png
MeterStyle=buttanstyl
X=(2)*#scaledpi#
Y=(2)*#scaledpi#
LeftMouseUpAction=!SendKey MediaPrevTrack

[Play]
Meter=Image
ImageName=#@#Graphics\TextItems\NowPlaying\PlayPause.png
MeterStyle=buttanstyl
LeftMouseUpAction=!SendKey MediaPlayPause

[Next]
Meter=Image
ImageName=#@#Graphics\TextItems\NowPlaying\next.png
MeterStyle=buttanstyl
LeftMouseUpAction=!SendKey MediaNextTrack