[Rainmeter]
DragGroup=WP7Panel
Group=Panel
Author=OMSociety
MouseActionCursor=0
MouseScrollDownAction=[!SetVariable Offset "(#Offset#+#EventH#)"][!UpdateMeasure MeasureParse]
MouseScrollUpAction=[!SetVariable Offset "(#Offset#-#EventH#)"][!UpdateMeasure MeasureParse]
MiddleMouseUpAction=!DeactivateConfig
; 需要每秒更新一次：静置回顶靠脚本自己比对时间（原项目多数面板是 Update=-1）
Update=1000 | Invisible 60000
Blur=#globalblurenable#
BlurRegion=#blurtype#,(5-#Padding#),(5-#Padding#),((#Height#*2+10+(#Padding#*2))*#ScaleDpi#+#PaddingW#+(#Padding#)),((#Height#+(#Padding#*2))*#ScaleDpi#+#PaddingH#+(#Padding#)),#blurcornerradius#
OnRefreshAction=[!UpdateMeasure MeasureParse]

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Common\Config\config.exe" #PanelType# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#"]
ContextTitle2=#Refresh#
ContextAction2=[!Refresh #CurrentConfig#]
ContextTitle3=#Alternative#
ContextAction3=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle4=#Close#
ContextAction4=[!DeactivateConfig]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#Personalization#
ContextAction6=[!WriteKeyValue Variables LastCat "cat6" "#ROOTCONFIGPATH#\Gallery\scroll.inc"][!ActivateConfig "wp7\Gallery" "Main.ini"]
ContextTitle7=#AddItems#
ContextAction7=[!WriteKeyValue Variables LastCat "cat2" "#ROOTCONFIGPATH#\Gallery\scroll.inc"][!ActivateConfig "wp7\Gallery" "Main.ini"]
ContextTitle8=----
ContextAction8=[]
ContextTitle9=#Moreactions#
ContextAction9=[!SkinMenu]

[Metadata]
Version=0.1.0
Information=Agenda (ICS subscription) Panel
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]
Height=150
PanelType=double
PanelName=Agenda

@include=#@#Common\Variables\UserVariables.inc
@include1=#@#Common\Variables\Languages\#MainLanguage#.inc
@include2=#@#Common\color\color.inc
@include3=#@#Config\Panels\Agenda\UserVariables.inc
@include4=#@#Structure\#PanelType#\Main.inc
; private feed overrides, gitignored; falls back to @include3 defaults when absent
@include5=#@#Config\Panels\Agenda\UserVariables.local.inc

VisibleRows=4
ViewH=120
ListTop=8
HeaderH=34
EventH=38
RowW=250
PadX=30
Offset=0
MaxOffset=0

; 仅用作裁剪遮罩：被指定为 Container 的表自身不会被绘制，所以不能拿 [bg] 当遮罩
[Clip]
Meter=Image
SolidColor=0,0,0,255
X=(5-#Padding#)
Y=(5-#Padding#)
W=((#Height#*2+10+(#Padding#*2)))*#ScaleDpi#
H=((#Height#+(#Padding#*2)))*#ScaleDpi#

[Msg]
Meter=String
Group=Rows
Container=Clip
X=((#PadX#))*#ScaleDpi#
Y=((#Height#/1.3))*#ScaleDpi#
FontFace=#fonttype#
FontSize=(#Height#/22)*#ScaleDpi#
FontColor=#textcolor2#,140
AntiAlias=1
Text=""
Hidden=1

[MeasureICS1]
Measure=WebParser
Disabled=1
Url=#Feed1#
; 整页捕获：Download=1 时字符串值会变成下载文件的路径，拿不到正文
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=3600

[MeasureICS2]
Measure=WebParser
Disabled=1
Url=#Feed2#
; 整页捕获：Download=1 时字符串值会变成下载文件的路径，拿不到正文
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=3600

[MeasureICS3]
Measure=WebParser
Disabled=1
Url=#Feed3#
; 整页捕获：Download=1 时字符串值会变成下载文件的路径，拿不到正文
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=3600

[MeasureParse]
Measure=Script
ScriptFile=#CURRENTPATH#agenda.lua

[Bar1]
Meter=Image
Group=Rows
Container=Clip
SolidColor=#textcolor2#,90
X=0
Y=0
W=(#Height#/70)*#ScaleDpi#
H=(#EventH#)*#ScaleDpi#
DynamicVariables=1
Hidden=1

[Row1]
Meter=String
Group=Rows
Container=Clip
X=0
Y=0
W=(#RowW#)*#ScaleDpi#
FontFace=#fonttype#
FontSize=(#Height#/14)*#ScaleDpi#
FontColor=#textcolor2#,255
AntiAlias=1
StringAlign=LeftTop
ClipString=1
DynamicVariables=1
Hidden=1

[Time1]
Meter=String
Group=Rows
Container=Clip
X=0
Y=0
W=(#RowW#)*#ScaleDpi#
FontFace=#fonttype#
